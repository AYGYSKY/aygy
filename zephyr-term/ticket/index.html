<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乘票 · 防风 Zephyr</title>
<meta name="description" content="从川泽出发，目的地你写。">
<style>
:root{
  --bg:#050c0e;
  --main:#009E9D;
  --hi:#8ff5ec;
  --ink:#e9f6f5;
  --dim:#6f8f92;
  --line:rgba(0,201,194,.18);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(0,158,157,.13), transparent 60%),
    radial-gradient(80% 60% at 50% 110%, rgba(0,158,157,.07), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  opacity:.3;mix-blend-mode:multiply;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:89;
  background:radial-gradient(120% 100% at 50% 50%, transparent 58%, rgba(0,0,0,.5));
}

.wrap{
  position:relative;
  max-width:1040px;margin:0 auto;
  padding:clamp(20px,4vw,44px) clamp(14px,4vw,28px) 70px;
}

/* 顶栏 */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--dim);
  padding-bottom:10px;margin-bottom:clamp(18px,3vw,30px);
  border-bottom:1px solid var(--line);
}
.bar a{color:var(--dim);text-decoration:none}
.bar a:hover{color:var(--hi)}
.bar b{color:var(--hi);font-weight:500}
.bar .ro{color:var(--main);border:1px solid rgba(0,201,194,.35);border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:.14em}

/* 标题 */
.head{margin-bottom:22px}
.head h1{font-size:clamp(19px,3.4vw,25px);font-weight:600;letter-spacing:.05em}
.head p{
  margin-top:8px;font-size:13px;color:var(--dim);line-height:1.8;
}
.head p code{
  font-family:var(--mono);font-size:12px;color:var(--main);
  background:rgba(0,158,157,.08);padding:1px 5px;border-radius:2px;
}

/* 票 */
.stage{
  position:relative;z-index:95;
  border:1px solid var(--line);
  background:rgba(0,158,157,.02);
  padding:clamp(8px,1.6vw,16px);
  border-radius:3px;
}
.stage::before{
  content:"PREVIEW · 1990 × 820";position:absolute;top:-1px;right:-1px;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  color:#052a2b;background:var(--main);
  padding:2px 9px;border-radius:0 3px 0 3px;z-index:3;
}
#ticket{
  display:block;width:100%;height:auto;
  border-radius:2px;
  box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
}

/* 控件 */
/* 手机上票太宽，给横向滑动 */
@media (max-width:760px){
  .stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  #ticket{width:760px;max-width:none}
  .stage::after{
    content:"← 左右滑动看全票 →";
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:9px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;
    color:rgba(0,201,194,.6);pointer-events:none;white-space:nowrap;
  }
}

.ctrl{
  margin-top:clamp(20px,3vw,30px);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px 18px;
}
.f{display:flex;flex-direction:column;gap:6px}
.f label{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--main);
}
.f input,.f select{
  font-family:var(--sans);font-size:14px;color:var(--ink);
  background:rgba(0,158,157,.06);
  border:1px solid rgba(0,201,194,.28);
  border-radius:2px;padding:9px 11px;
  outline:none;transition:border-color .18s, background .18s;
  width:100%;
}
.f input:focus,.f select:focus{
  border-color:var(--hi);background:rgba(0,158,157,.11);
}
.f input::placeholder{color:#4e6668}
.f select{color-scheme:dark;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.f select option{
  background:#0b1a1c;color:#e9f6f5;
  font-family:var(--sans);font-size:14px;padding:8px;
}
.f select option:checked{background:#123c3c;color:#8ff5ec}

.actions{
  margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;
}
.btn{
  font-family:var(--sans);font-size:14px;letter-spacing:.05em;
  padding:11px 22px;border-radius:2px;cursor:pointer;
  border:1px solid rgba(0,201,194,.42);
  background:rgba(0,158,157,.1);color:var(--hi);
  transition:background .18s,border-color .18s,transform .1s;
}
.btn:hover{background:rgba(0,158,157,.2);border-color:var(--hi)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--main);color:#04292a;border-color:var(--main);font-weight:600}
.btn.primary:hover{background:#00b4b3;border-color:#00b4b3}

.tip{
  margin-top:22px;font-family:var(--mono);font-size:10.5px;line-height:2;
  color:#4f6a6c;letter-spacing:.05em;
}

.foot{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;line-height:2;color:#4f6a6c;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <span><b>TER-M</b> &nbsp;/&nbsp; <a href="../index.html">⟵ 终端</a> &nbsp;/&nbsp; 车票</span>
    <span class="ro">只读镜像</span>
  </div>

  <div class="head">
    <h1>乘票</h1>
    <p>出发地固定为 <code>川泽</code>。目的地留空，你自己填——填什么都行，反正这趟车不解释。</p>
  </div>

  <div class="stage">
    <canvas id="ticket" width="1990" height="820"></canvas>
  </div>

  <div class="ctrl">
    <div class="f">
      <label>目的地</label>
      <input id="to" type="text" maxlength="14" placeholder="你写" autocomplete="off">
    </div>
    <div class="f">
      <label>持票人</label>
      <input id="who" type="text" maxlength="14" placeholder="你" autocomplete="off">
    </div>
    <div class="f">
      <label>日期</label>
      <input id="date" type="date">
    </div>
    <div class="f">
      <label>座位</label>
      <select id="seat">
        <option value="c3">c3 · 低</option>
        <option value="c4" selected>c4 · 中</option>
        <option value="c5">c5 · 高</option>
        <option value="c6">c6 · 极限</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="save">存成图片</button>
    <button class="btn" id="reroll">换一句寄语</button>
  </div>

  <div class="tip">
    PNG · 1990 × 820 · 双击图片也能直接存<br>
    车次编号由日期生成，同一天出同一张票
  </div>

  <div class="foot">
    防风 Zephyr · 形象来自「防风Zephyr」企划组 · 允许非商用二次分发
  </div>
</div>

    // 大号座位
    setFont(10.5, 400, F.mono);
    text("座位  SEAT", R, 296, { color: C.mute, spacing: 1.8 });
    setFont(76, 700, F.mono);
    text(seat.toUpperCase(), R, 372, { color: C.accent, spacing: 2 });

    line(R, 404, 1900, 404, "rgba(18,49,53,.12)", 1);

    // 三行
    var rows = [
      ["车　次", train],
      ["日　期", d.y + "." + d.md],
      ["舱　位", "靠窗"]
    ];
    for (var ri = 0; ri < rows.length; ri++){
      var ry = 452 + ri * 62;
      setFont(11, 400, F.mono);
      text(rows[ri][0], R, ry, { color: C.mute, spacing: 2 });
      setFont(21, 500, F.mono);
      text(rows[ri][1], 1900, ry, { color: C.ink, align: "right", spacing: 1 });
      line(R, ry + 14, 1900, ry + 14, "rgba(18,49,53,.10)", 1);
    }

    // 联句（应援口号拆两行，靠左，不压印章）
    (function(){
      var x = R;
      setFont(12.5, 400, F.serif);
      text("川泽生防风　清歌彻远岑", x, 640, { color: C.accent, spacing: 1 });
      setFont(9.5, 400, F.mono);
      text("— 回云司 · 应援", x, 664, { color: C.mute, spacing: 1.6 });
    })();

    // 右上印章
    (function(){
      var cx = 1832, cy = 648, r = 50;
      ctx.save();
      ctx.strokeStyle = "rgba(0,158,157,.55)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.arc(cx, cy, r - 7, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      setFont(15, 600, F.serif);
      text("驿站", cx, cy - 4, { color: C.accent, align: "center" });
      setFont(8.5, 400, F.mono);
      text("POST", cx, cy + 18, { color: "rgba(0,158,157,.7)", align: "center", spacing: 1 });
    })();

    line(R, 782, 1900, 782, "rgba(18,49,53,.12)", 1);
    setFont(10, 400, F.mono);
    text("只读镜像 · 不得转售", R, 806, { color: C.mute, spacing: .8 });

    // 存根剪切提示
    setFont(9, 400, F.mono);
    ctx.save();
    ctx.translate(SPLIT - 26, H / 2);
    ctx.rotate(-Math.PI / 2);
    text("沿虚线撕开", 0, 0, { color: "rgba(139,156,152,.85)", align: "center", spacing: 3 });
    ctx.restore();
  }

  /* ================= 交互 ================= */
  elTo.addEventListener("input", draw);
  elWho.addEventListener("input", draw);
  elDate.addEventListener("change", draw);
  elSeat.addEventListener("change", draw);

  document.getElementById("reroll").addEventListener("click", function(){
    var n = noteIdx;
    while (n === noteIdx && NOTES.length > 1) n = Math.floor(Math.random() * NOTES.length);
    noteIdx = n;
    draw();
  });

  document.getElementById("save").addEventListener("click", function(){
    var url = cv.toDataURL("image/png");
    var a = document.createElement("a");
    var d = fmtDate(elDate.value);
    a.download = "乘票-川泽-" + d.full.replace(/\./g, "") + "-" + elSeat.value + ".png";
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // 双击图片也能存
  cv.addEventListener("dblclick", function(){
    document.getElementById("save").click();
  });

  // 初始寄语：按日期取一条，同一天同一句
  noteIdx = hash(todayStr) % NOTES.length;
  draw();

  // 字体就绪后重画一次（避免首帧用回退字体）
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(draw);
  }
})();
</script>

<script>
/* 每页都能弹两下：按 1–7 是七根空弦 */
(function(){
  var OPEN=[130.81,146.83,174.61,196.00,220.00,261.63,293.66];
  var NAME=["C3","D3","F3","G3","A3","C4","D4"];
  var CN=["一","二","三","四","五","六","七"];
  var ac=null,box=null,tid=null;

  function ac_(){ if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ac=new C(); } return ac; }

  function pluck(f){
    var a=ac_(); if(!a) return;
    if(a.state==="suspended") a.resume();
    var sr=a.sampleRate, N=Math.max(2,Math.round(sr/f));
    var dur=1.7, buf=a.createBuffer(1,Math.round(sr*dur),sr), d=buf.getChannelData(0);
    var line=new Float32Array(N), i;
    for(i=0;i<N;i++) line[i]=Math.random()*2-1;
    var p=0;
    for(i=0;i<d.length;i++){
      var cur=line[p], nxt=line[(p+1)%N];
      d[i]=cur;
      line[p]=(cur+nxt)*0.5*0.9974;
      p=(p+1)%N;
    }
    /* 末尾淡出，防爆音 */
    var tail=Math.round(sr*0.06);
    for(i=d.length-tail;i<d.length;i++) d[i]*=(d.length-i)/tail;

    var src=a.createBufferSource(); src.buffer=buf;
    var lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2800;
    var g=a.createGain(); g.gain.value=0.30;
    src.connect(lp); lp.connect(g); g.connect(a.destination);
    src.start();
  }

  function tip(t){
    if(!box){
      box=document.createElement("div");
      box.style.cssText="position:fixed;right:18px;bottom:18px;z-index:99;"
        +"font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#8ff5ec;"
        +"background:rgba(5,12,14,.88);border:1px solid rgba(0,201,194,.30);"
        +"border-radius:2px;padding:6px 12px;opacity:0;transition:opacity .18s;pointer-events:none";
      document.body.appendChild(box);
    }
    box.textContent=t;
    box.style.opacity="1";
    clearTimeout(tid);
    tid=setTimeout(function(){ box.style.opacity="0"; }, 900);
  }

  document.addEventListener("keydown", function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target&&e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=7){
      e.preventDefault();
      pluck(OPEN[n-1]);
      tip("♪ "+CN[n-1]+"弦 "+NAME[n-1]);
    }
  });
})();
</script>
