<!DOCTYPE html>
<!-- 七盏灯 v2 · 2026-11-22 · 七个字母在这里 -->

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单词表 · WORDS｜AYGY 暗夜古韵</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body{background:
    radial-gradient(900px 420px at 12% -8%, rgba(229,142,176,.06), transparent 70%),
    radial-gradient(760px 380px at 92% 4%, rgba(0,158,157,.05), transparent 72%),
    var(--bg);}

  /* 顶部 */
  .wbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;
    padding:14px 56px;border-bottom:1px solid var(--line);
    background:rgba(10,10,14,.86);backdrop-filter:blur(14px);
  }
  .wbar .back{font-size:12px;letter-spacing:.1em;color:var(--ink-2);transition:.3s}
  .wbar .back:hover{color:var(--pink)}
  .wbar h1{font-size:13px;font-weight:400;letter-spacing:.34em;margin:0 auto;color:var(--ink-2)}
  .wbar .count{font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
  .wbar .count b{color:var(--pink);font-weight:400}

  /* 卷首 */
  .whead{padding:52px 56px 26px;border-bottom:1px solid var(--line)}
  .whead .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--ink-3);margin-bottom:16px}
  .whead h2{font-size:38px;font-weight:400;letter-spacing:.14em;margin:0 0 12px}
  .whead p{margin:0;font-size:12.5px;line-height:1.95;color:var(--ink-2);letter-spacing:.04em;max-width:40em}

  /* 进度 */
  .prog{display:flex;align-items:center;gap:22px;margin-top:26px}
  .bar{position:relative;flex:1;height:3px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--pink),#f0b6cb);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .prog .num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
  .prog .num b{color:var(--ink);font-weight:400}

  /* 工具条 */
  .tools{
    position:sticky;top:53px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:14px 56px;border-bottom:1px solid var(--line);
    background:rgba(10,10,14,.9);backdrop-filter:blur(14px);
  }
  .search{
    flex:1;min-width:180px;position:relative;
  }
  .search input{
    width:100%;padding:8px 12px;font-family:var(--serif);font-size:12.5px;letter-spacing:.05em;
    color:var(--ink);background:rgba(255,255,255,.03);
    border:1px solid var(--line);outline:none;transition:.3s;
  }
  .search input:focus{border-color:rgba(229,142,176,.5);background:rgba(255,255,255,.05)}
  .search input::placeholder{color:var(--ink-3)}
  .chip{
    padding:7px 13px;font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);
    border:1px solid var(--line);background:transparent;cursor:pointer;transition:.3s;
    font-family:var(--serif);
  }
  .chip:hover{color:var(--ink);border-color:rgba(255,255,255,.24)}
  .chip.on{color:#0a0a0e;background:var(--pink);border-color:var(--pink)}
  .sep{width:1px;height:16px;background:var(--line);margin:0 4px}
  select.sel{
    padding:6px 10px;font-family:var(--serif);font-size:11.5px;letter-spacing:.06em;
    color:var(--ink-2);background:rgba(255,255,255,.03);
    border:1px solid var(--line);outline:none;cursor:pointer;max-width:230px;
  }
  select.sel:focus{border-color:rgba(229,142,176,.5)}
  select.sel option{background:#131318;color:#e9e6e1}

  /* 组 */
  .gblock{padding:34px 56px 6px;border-bottom:1px solid var(--line)}
  .ghead{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;cursor:pointer;user-select:none}
  .ghead:hover h3{color:var(--pink)}
  .ghead .caret{
    font-family:var(--mono);font-size:12px;color:var(--ink-2);width:12px;
    text-align:center;transition:color .3s;display:inline-block;
  }
  .ghead .caret::before{content:"+"}
  .gblock:not(.collapsed) .ghead .caret::before{content:"2"}
  .ghead:hover .caret{color:var(--pink)}
  .gblock.collapsed .ghead{margin-bottom:0}
  .gblock.collapsed{padding-top:24px;padding-bottom:6px}
  .gbody{overflow:hidden}
  .gblock.collapsed .gbody{display:none}
  .ghead .no{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ink-3)}
  .ghead h3{font-size:20px;font-weight:400;letter-spacing:.12em;margin:0}
  .ghead .stat{font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);margin-left:auto}
  .ghead .pass{
    font-size:11px;letter-spacing:.1em;color:var(--teal);cursor:pointer;
    border-bottom:1px solid rgba(0,158,157,.3);padding-bottom:2px;transition:.3s;
  }
  .ghead .pass:hover{color:#4fd8d6;border-color:rgba(79,216,214,.6)}

  /* 词条 */
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 26px;margin-bottom:16px}
  .wrow{
    display:grid;grid-template-columns:20px auto 1fr;gap:9px;align-items:baseline;
    padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.07);
    transition:.25s;
  }
  .wrow:hover{border-color:rgba(255,255,255,.16)}
  .wrow.done .word{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(229,142,176,.5)}
  .wrow.done .mean{color:var(--ink-3)}
  .wrow label{display:contents;cursor:pointer}
  .box{
    appearance:none;width:13px;height:13px;margin:0;flex:none;
    border:1px solid rgba(255,255,255,.28);background:transparent;cursor:pointer;
    position:relative;top:2px;transition:.25s;
  }
  .box:hover{border-color:var(--pink)}
  .box:checked{background:var(--pink);border-color:var(--pink)}
  .box:checked:after{
    content:"";position:absolute;left:4px;top:0px;width:4px;height:8px;
    border-right:1.5px solid #0a0a0e;border-bottom:1.5px solid #0a0a0e;
    transform:rotate(40deg);
  }
  .word{
    font-size:13.5px;letter-spacing:.03em;color:var(--ink);white-space:nowrap;
    cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.16);
    transition:color .2s,border-color .2s;
  }
  .word:hover{color:var(--pink);border-bottom-color:rgba(229,142,176,.6)}
  .pos{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-left:6px}
  .mean{
    font-size:12px;color:var(--ink-2);letter-spacing:.02em;padding-left:14px;
    opacity:0;transition:opacity .18s;cursor:pointer;
  }
  .mean.show{opacity:1}

  /* 短文 */
  .passage{
    display:none;margin:6px 0 30px;padding:24px 28px;
    background:rgba(255,255,255,.022);border-left:2px solid rgba(0,158,157,.45);
  }
  .passage.on{display:block;animation:fade .45s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .passage h4{margin:0 0 12px;font-size:13px;font-weight:400;letter-spacing:.12em;color:var(--ink-2)}
  .passage .en{font-size:13px;line-height:2.05;letter-spacing:.02em;color:var(--ink-2);margin:0 0 18px}
  .passage .en strong{color:var(--pink);font-weight:400;border-bottom:1px solid rgba(229,142,176,.3)}
  .passage .cn{font-size:12.5px;line-height:2;letter-spacing:.03em;color:var(--ink-3);margin:0}

  .empty{padding:80px 56px;text-align:center;color:var(--ink-3);font-size:12.5px;letter-spacing:.1em}

  @media (max-width:1080px){
    .wbar,.whead,.tools,.gblock{padding-left:24px;padding-right:24px}
    .wgrid{grid-template-columns:1fr 1fr}
  }
  @media (max-width:720px){
    .wgrid{grid-template-columns:1fr}
    .wbar h1{display:none}
  }
</style>
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
</head>
<body>

<div class="wbar">
  <a class="back" href="index.html">← 返回目录</a>
  <h1>单 词 表 · W O R D S</h1>
  <span class="count">已掌握 <b id="cTop">0</b> / <b id="cAll">0</b></span>
</div>

<header class="whead">
  <div class="kicker">VOCABULARY · CET-4</div>
  <h2>背单词</h2>
  <p><b id="gN">0</b> 个主题组、<b id="wN">0</b> 个词，每组配一篇中英对照短文。勾上左侧方框就算「会了」，状态存在本机，下次打开还在。搜索框可以打英文或中文，也能用右边下拉直接跳到某一组。</p>
  <div class="prog">
    <div class="bar"><i id="barFill"></i></div>
    <span class="num"><b id="cNum">0</b> / <b id="cSum">0</b></span>
  </div>
</header>

<div class="tools">
  <div class="search"><input id="q" type="search" placeholder="搜索：season / 季节 / platform …" autocomplete="off"></div>
  <select id="gsel" class="chip sel"><option value="0">全部组 · 44</option></select>
  <button class="chip on" data-f="all">全部</button>
  <button class="chip" data-f="todo">未掌握</button>
  <button class="chip" data-f="done">已掌握</button>
  <span class="sep"></span>
  <button class="chip" id="expandAll">全部展开</button>
  <button class="chip" id="showAll">显示释义</button>
  <button class="chip" id="reset">清空标记</button>
</div>

<main id="list"></main>

<footer class="footer">
  <span>© 2026 AYGY 暗夜古韵</span>
  <span>单词表 · <b id="fN">0</b> 词</span>
  <span>四个世界，一个人</span>
</footer>

<script src="assets/js/words.js"></script>
<script>
(function(){
  var DATA = window.WORDS || [];
  var KEY = 'aygy.words.done';
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { done = {}; }

  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');
  var filter = 'all';
  var openPass = {};
  var openSet = {};
  var showAll = false;

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {}
  }

  function total(){ return DATA.reduce(function(n,g){ return n + g.words.length; }, 0); }
  function doneCount(){ return DATA.reduce(function(n,g){
    return n + g.words.filter(function(w){ return done[key(g.num,w.w)]; }).length; }, 0); }
  function key(g,w){ return g + ':' + w; }

  function updateProg(){
    var t = total(), d = doneCount();
    ['cTop','cNum'].forEach(function(id){ document.getElementById(id).textContent = d; });
    ['cAll','cSum','fN'].forEach(function(id){ var el = document.getElementById(id); if(el) el.textContent = t; });
    document.getElementById('barFill').style.width = (t ? d / t * 100 : 0) + '%';
  }

  var gN = document.getElementById('gN'), wN = document.getElementById('wN');
  if(gN) gN.textContent = DATA.length;
  if(wN) wN.textContent = total();

  var gsel = document.getElementById('gsel');
  var gOnly = 0;
  if(gsel){
    DATA.forEach(function(g){
      var o = document.createElement('option');
      o.value = g.num;
      o.textContent = 'G' + (g.num < 10 ? '0' + g.num : g.num) + ' · ' + g.title;
      gsel.appendChild(o);
    });
    gsel.addEventListener('change', function(){ gOnly = +gsel.value; render(); });
  }

  function match(w, qs){
    if(!qs) return true;
    var s = (w.w + ' ' + w.c + ' ' + w.p).toLowerCase();
    return s.indexOf(qs) > -1;
  }

  function render(){
    var qs = qEl.value.trim().toLowerCase();
    var html = '';
    var shownTotal = 0;

    DATA.forEach(function(g){
      if(gOnly && g.num !== gOnly) return;
      var words = g.words.filter(function(w){
        var k = key(g.num, w.w);
        if(filter === 'todo' && done[k]) return false;
        if(filter === 'done' && !done[k]) return false;
        return match(w, qs);
      });
      if(!words.length) return;
      shownTotal += words.length;

      var gd = g.words.filter(function(w){ return done[key(g.num,w.w)]; }).length;

      var autoOpen = !!(qs) || filter !== 'all' || !!gOnly;
      var isOpen = autoOpen || !!openSet[g.num];
      html += '<section class="gblock' + (isOpen ? '' : ' collapsed') + '" data-g="' + g.num + '">';
      html += '<div class="ghead"><span class="caret"></span>'
           + '<span class="no">G' + (g.num < 10 ? '0' + g.num : g.num) + '</span>'
           + '<h3>' + g.title + '</h3>'
           + '<span class="stat">' + gd + ' / ' + g.words.length + '</span>'
           + '<span class="pass" data-pass="' + g.num + '">读短文 · ' + (g.passage.t || '') + '</span></div>';

      html += '<div class="gbody">';
      html += '<div class="wgrid">';
      words.forEach(function(w){
        var k = key(g.num, w.w);
        var on = !!done[k];
        html += '<div class="wrow' + (on ? ' done' : '') + '">'
             + '<input class="box" type="checkbox" data-k="' + k + '"' + (on ? ' checked' : '') + ' aria-label="' + w.w + '">'
             + '<span><span class="word">' + w.w + '</span><span class="pos">' + w.p + '</span></span>'
             + '<span class="mean' + (showAll ? ' show' : '') + '">' + w.c + '</span>'
             + '</div>';
      });
      html += '</div>';

      html += '<div class="passage' + (openPass[g.num] ? ' on' : '') + '" data-p="' + g.num + '">'
           + '<h4>' + (g.passage.t || '') + '</h4>'
           + '<p class="en">' + g.passage.en + '</p>'
           + '<p class="cn">' + g.passage.cn + '</p>'
           + '</div>';
      html += '</div>';   // gbody
      html += '</section>';
    });

    if(!shownTotal){
      html = '<div class="empty">没有符合条件的词。换个关键词，或把筛选切回「全部」。</div>';
    }
    listEl.innerHTML = html;
    updateProg();
  }

  listEl.addEventListener('change', function(e){
    var box = e.target.closest('.box');
    if(!box) return;
    var k = box.dataset.k;
    if(box.checked) done[k] = 1; else delete done[k];
    save();
    box.closest('.wrow').classList.toggle('done', box.checked);
    // 组内计数
    var g = box.closest('.gblock');
    var gnum = +g.dataset.g;
    var gi = DATA.filter(function(x){ return x.num === gnum; })[0];
    var gd = gi.words.filter(function(w){ return done[key(gnum, w.w)]; }).length;
    g.querySelector('.stat').textContent = gd + ' / ' + gi.words.length;
    updateProg();
  });

  listEl.addEventListener('click', function(e){
    var row = e.target.closest('.wrow');
    if(row && !e.target.closest('.box')){
      var m = row.querySelector('.mean');
      if(m) m.classList.toggle('show');
      return;
    }
    var head = e.target.closest('.ghead');
    if(head && !e.target.closest('.pass')){
      var sec = head.closest('.gblock');
      var n = +sec.dataset.g;
      var nowCollapsed = sec.classList.toggle('collapsed');
      openSet[n] = !nowCollapsed;
      return;
    }
    var p = e.target.closest('.pass');
    if(!p) return;
    var n = p.dataset.pass;
    var gb = p.closest('.gblock');
    if(gb.classList.contains('collapsed')){
      gb.classList.remove('collapsed');
      openSet[+gb.dataset.g] = true;
    }
    var box = listEl.querySelector('.passage[data-p="' + n + '"]');
    openPass[n] = !openPass[n];
    box.classList.toggle('on', openPass[n]);
  });

  qEl.addEventListener('input', render);

  document.querySelectorAll('.chip[data-f]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.chip[data-f]').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      filter = b.dataset.f;
      render();
    });
  });

  var allOpen = false;
  document.getElementById('expandAll').addEventListener('click', function(){
    allOpen = !allOpen;
    DATA.forEach(function(g){ openSet[g.num] = allOpen; });
    this.textContent = allOpen ? '全部收起' : '全部展开';
    render();
  });

  document.getElementById('showAll').addEventListener('click', function(){
    showAll = !showAll;
    this.textContent = showAll ? '隐藏释义' : '显示释义';
    this.classList.toggle('on', showAll);
    listEl.querySelectorAll('.mean').forEach(function(m){ m.classList.toggle('show', showAll); });
  });

  document.getElementById('reset').addEventListener('click', function(){
    if(!confirm('清空全部勾选？')) return;
    done = {}; save(); render();
  });

  render();
})();
</script>
<script src="assets/js/ui.js"></script>
<style>
  /* 七盏灯 · 第七盏 —— 第七次来 */
  #vsecret{
    position:fixed;left:50%;bottom:88px;z-index:65;
    transform:translate(-50%,8px);
    max-width:420px;padding:14px 22px;
    background:rgba(8,7,6,.9);
    border:1px solid rgba(255,180,94,.34);
    border-radius:4px;
    color:rgba(255,214,160,.86);
    font-family:var(--serif, "Songti SC", "SimSun", serif);
    font-size:12px;line-height:2.1;letter-spacing:.06em;
    text-align:center;
    opacity:0;pointer-events:none;
    transition:opacity 1.4s ease, transform 1.4s ease;
  }
  #vsecret.on{opacity:1;transform:translate(-50%,0)}
  #vsecret b{display:block;margin:7px 0;color:#ffb45e;font-weight:400;letter-spacing:.34em}
  #vsecret em{display:block;margin-top:8px;font-style:normal;font-size:11px;color:rgba(255,214,160,.6)}
</style>
<div id="vsecret">
  第七次。<br>
  你已经来过七次了哦。<br>
  希望你能坚持下去。
  <b>第七盏：N</b>
  记得回 anse，输 lantern。
</div>
<script>
(function(){
  var K = 'aygy.lantern.visits', D = 'aygy.lantern.done';
  var n = 1, done = false;
  try {
    n = parseInt(localStorage.getItem(K) || '0', 10) + 1;
    localStorage.setItem(K, String(n));
    done = localStorage.getItem(D) === '1';
  } catch (e) { return; }

  var el = document.getElementById('vsecret');
  if (!el) return;

  if (n >= 7 || done){
    try { localStorage.setItem(D, '1'); } catch (e) {}
    if (done){
      /* 第七盏已经亮过：留一行更淡的暗记，不再吵 */
      el.innerHTML = '第七盏还亮着。<b>N</b>加油哦';
      el.style.fontSize = '11px';
      el.style.borderColor = 'rgba(255,180,94,.18)';
      el.style.background = 'rgba(8,7,6,.62)';
    }
    setTimeout(function(){ el.classList.add('on'); }, 900);
    setTimeout(function(){ el.classList.remove('on'); }, done ? 9000 : 16000);
  }
})();
</script>
</body>
