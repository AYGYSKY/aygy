<!DOCTYPE html>
<!-- 七盏灯 v2 · 2026-11-22 · 七个字母在这里 -->

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紫罗兰 · LANTERN</title>
<style>
  :root{
    --bg:#05050a; --ink:#e9e6e1;
    --cyan:#6fe3d6; --warm:#ffb45e;
    --line:rgba(255,255,255,.08);
    --mono:Consolas,"Courier New",monospace;
    --song:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--song);overflow-x:hidden;overflow-y:auto}

  #rain{position:fixed;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
  #chars{position:fixed;inset:0;width:100%;height:100%;opacity:.6;pointer-events:none;z-index:2}

  .bar{
    position:fixed;left:0;right:0;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:17px 34px;font-size:11.5px;letter-spacing:.22em;
    color:rgba(255,255,255,.34);border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(5,5,10,.9),rgba(5,5,10,0));
  }
  .bar a{color:inherit;text-decoration:none;transition:color .3s}
  .bar a:hover{color:var(--cyan)}
  .bar .mid{letter-spacing:.34em;color:rgba(255,255,255,.5)}

  main{
    position:relative;z-index:3;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:24px;padding:88px 24px 56px;box-sizing:border-box;
  }

  #flower{width:250px;height:250px;display:block;overflow:visible}
  #petals{transform-origin:0 0;animation:pccw 120s linear infinite}
  #core{transform-origin:0 0;animation:pcw 90s linear infinite}
  @keyframes pccw{to{transform:rotate(-360deg)}}
  @keyframes pcw{to{transform:rotate(360deg)}}
  #petals .petal{
    fill:rgba(167,139,250,.075);stroke:rgba(167,139,250,.30);stroke-width:1;
    transition:fill .55s ease,stroke .55s ease,filter .55s ease;
  }
  #petals .petal.on{
    fill:url(#petalFill);stroke:#ddd6fe;
    filter:drop-shadow(0 0 9px rgba(150,110,240,.75));
  }
  #core .cp{
    fill:rgba(167,139,250,.16);stroke:rgba(196,181,253,.30);stroke-width:.8;
    transition:fill .25s ease,stroke .25s ease,filter .25s ease;
  }
  #core .eye{fill:rgba(255,209,102,.25);transition:fill .25s ease}
  #flower.lit #core .cp{
    fill:url(#petalFill);stroke:#e9e4ff;
    filter:drop-shadow(0 0 10px rgba(167,139,250,.85));
  }
  #flower.lit #core .eye{fill:#ffd166}
  #flower.lit{filter:drop-shadow(0 0 34px rgba(140,100,230,.32))}

  .bar .mid{color:#a78bfa;letter-spacing:.34em;text-shadow:0 0 18px rgba(150,110,240,.45)}
  #hint{font-size:12px;letter-spacing:.26em;color:rgba(255,255,255,.22);margin-top:4px;transition:color .6s ease}
  #go{
    display:inline-block;margin-top:26px;padding:7px 18px;
    border:1px solid rgba(167,139,250,.42);border-radius:999px;
    color:rgba(201,184,255,.86);font-size:11px;letter-spacing:.22em;
    text-decoration:none;transition:.4s;
  }
  #go:hover{border-color:rgba(167,139,250,.8);color:#d7ccff;box-shadow:0 0 22px -4px rgba(140,100,230,.5)}
  #hint.on{color:rgba(255,255,255,.44)}

  /* ---------- 七盏灯的位置 ---------- */
  #lamps{display:flex;gap:10px;margin-top:26px}
  #lamps button{
    width:22px;height:22px;padding:0;background:none;
    border:1px solid rgba(255,214,160,.28);border-radius:2px;
    color:rgba(255,214,160,.5);font:inherit;font-size:11px;
    line-height:20px;text-align:center;cursor:pointer;
    transition:border-color .35s,color .35s,box-shadow .35s;
  }
  #lamps button:hover{border-color:rgba(255,214,160,.7);color:rgba(255,214,160,.9)}
  #lamps button.on{
    border-color:rgba(255,214,160,.85);color:#ffd6a0;
    box-shadow:0 0 14px -2px rgba(255,180,94,.6);
  }
  #tip{
    width:100%;max-width:440px;box-sizing:border-box;
    margin-top:16px;min-height:44px;
    padding:12px 22px;
    font-size:12.5px;line-height:2;letter-spacing:.1em;
    color:rgba(255,228,190,.86);text-align:center;
    background:rgba(6,6,12,.7);
    border:1px solid rgba(255,214,160,.12);
    text-shadow:0 0 14px rgba(6,6,12,.9);
    transition:border-color .4s;
  }
  #tip .who{color:rgba(255,255,255,.3);letter-spacing:.18em}

  @media (max-width:640px){
    #flower{width:196px;height:196px}
    .bar{padding:14px 18px;font-size:10px}
  }

  /* ---------- 第二层入口 ---------- */
  #layer2{
    display:none;flex-direction:column;align-items:center;
    margin-top:26px;opacity:0;transition:opacity 1.4s ease;
  }
  #layer2.on{display:flex;opacity:1}
  .l2ln{
    margin:0 0 6px;
    opacity:0;transform:translateY(8px);
    transition:opacity 1.3s ease, transform 1.3s ease;
  }
  .l2ln.on{opacity:1;transform:none}
  .l2hint,.l2hint.on{transition:opacity 1.2s ease}
  .l2hint{opacity:0}
  .l2hint.on{opacity:1}
  #l2Wrap{opacity:.01;transition:opacity 1.2s ease}
  #l2Wrap.on{opacity:1}
  .l2hint{
    margin:14px 0 10px;
    color:rgba(167,139,250,.42);
    font-size:11px;letter-spacing:.16em;
    font-family:ui-monospace,Consolas,monospace;
  }
  .l2ask{
    max-width:430px;margin-bottom:14px;
    font-size:12.5px;line-height:2.1;letter-spacing:.1em;
    color:rgba(201,184,255,.72);text-align:center;
  }
  #l2Wrap{
    display:flex;align-items:center;gap:10px;
    width:100%;max-width:430px;box-sizing:border-box;
    padding:11px 18px;
    border:1px solid rgba(167,139,250,.28);
    border-left:2px solid rgba(167,139,250,.55);
    border-radius:2px;background:rgba(8,6,16,.6);
    transition:border-color .35s,background .35s;
  }
  #l2Wrap:focus-within{border-color:rgba(167,139,250,.6);background:rgba(14,10,26,.75)}
  #l2Wrap .ps-caret{color:rgba(167,139,250,.75);font-size:12px}
  #l2pass{
    flex:1;min-width:0;background:none;border:0;outline:0;
    color:rgba(226,214,255,.9);
    font-family:inherit;font-size:12px;letter-spacing:.22em;
    padding:2px 0;
  }
  #l2pass::placeholder{color:rgba(167,139,250,.38);letter-spacing:.1em}
  #l2Wrap.bad{animation:pshake .34s}

  /* ---------- 第三层：把灯带走 ---------- */
  /* 三层的「夜」标记 */
  .night{display:none;margin:0 0 26px;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;
    color:rgba(233,230,225,.5)}
  .night:before{content:'';display:block;width:34px;height:1px;margin:0 0 12px;background:rgba(255,180,94,.4)}
  .night em{font-style:normal;color:rgba(255,180,94,.72);letter-spacing:.16em;margin-left:10px}
  #n1.on,#n2.on,#n3.on{display:block}
  #n1{max-width:62ch;margin:34px auto 0}
  #layer3{opacity:0;display:none;max-width:62ch;margin:0 0 90px}
  #layer3.on{display:block;animation:l3in 1.4s ease .1s forwards}
  @keyframes l3in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #layer3 .l3ln{margin:0 0 10px;font-size:14px;line-height:2.1;color:rgba(233,230,225,.9);letter-spacing:.04em;opacity:0;transform:translateY(6px);transition:1.1s ease}
  #layer3 .l3ln.on{opacity:1;transform:none}
  #l3take{margin:26px 0 0}
  #l3take button{
    font:inherit;font-size:12px;letter-spacing:.22em;color:#ffb45e;cursor:pointer;
    background:rgba(255,180,94,.06);border:1px solid rgba(255,180,94,.38);
    padding:11px 22px;transition:.35s ease;
  }
  #l3take button:hover{background:rgba(255,180,94,.14);border-color:rgba(255,180,94,.75)}
  #l3put{display:none;margin:30px 0 0}
  #l3put.on{display:block;animation:l3in 1s ease forwards}
  #l3put .l3drop{
    display:block;cursor:pointer;padding:26px 22px;text-align:center;
    border:1px dashed rgba(255,180,94,.32);background:rgba(255,180,94,.03);
    font-size:12px;letter-spacing:.14em;color:rgba(255,180,94,.75);transition:.35s ease;
  }
  #l3put .l3drop:hover{border-color:rgba(255,180,94,.7);background:rgba(255,180,94,.08)}
  #l3put .l3drop b{display:block;font-weight:400;font-size:13px;letter-spacing:.2em;color:#ffd7a6;margin:0 0 8px}
  #l3msg{margin:16px 0 0;font-size:12px;line-height:1.95;letter-spacing:.06em;color:rgba(255,180,94,.72);min-height:20px;white-space:pre-line}
  #l3msg.bad{color:#e09090}
  /* 记录导出 */
  #l3note{display:none;margin:34px 0 0;padding:24px 0 0;border-top:1px solid rgba(255,255,255,.08)}
  #l3note.on{display:block}
  #l3note p{margin:0 0 16px;font-size:12.5px;line-height:2;letter-spacing:.06em;color:rgba(233,230,225,.58)}
  #l3note p em{font-style:normal;color:rgba(255,180,94,.82)}
  #l3save{background:transparent;border:1px solid rgba(255,180,94,.4);color:rgba(255,214,166,.92);
    font:inherit;font-size:12px;letter-spacing:.22em;padding:10px 22px;cursor:pointer;transition:.3s}
  #l3save:hover{background:rgba(255,180,94,.1);border-color:rgba(255,180,94,.8);color:#ffd7a6}
  #l3saved{margin:14px 0 0;font-size:11.5px;letter-spacing:.14em;color:rgba(167,139,250,.7);min-height:16px}
  #resetline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:70px 0 0;padding-top:22px;
    border-top:1px solid rgba(255,255,255,.06);font-size:11px;letter-spacing:.1em;color:rgba(233,230,225,.34)}
  #rstBtn{background:transparent;border:1px solid rgba(255,255,255,.16);color:rgba(233,230,225,.5);
    font:inherit;font-size:11px;letter-spacing:.16em;padding:7px 14px;cursor:pointer;transition:.28s}
  #rstBtn:hover{border-color:rgba(255,255,255,.4);color:rgba(233,230,225,.85)}
  #rstBtn.armed{border-color:rgba(255,120,120,.6);color:#ffb0b0}
  #rstMsg{font-size:11px;letter-spacing:.08em;color:rgba(233,230,225,.32)}
  #rstMsg.warn{color:rgba(255,150,150,.72)}
  #rstMsg.done{color:rgba(255,214,166,.72)}
  #l3end{display:none;margin:0;padding:26px 30px;background:rgba(6,6,10,.62);border-left:2px solid rgba(255,180,94,.34)}
  #l3end.on{display:block}
  #l3end p{margin:0 0 13px;font-size:15px;line-height:2.05;letter-spacing:.05em;color:rgba(233,230,225,.94);opacity:0;transition:1.5s ease}
  #l3end p.on{opacity:1}
  #l3end .warm{color:#ffd7a6;font-size:18px;letter-spacing:.1em}
  body.l3done #petals .petal{opacity:1;filter:none}
  body.l3done #rain{opacity:.42}

</style>

  #finale span{display:block}

<canvas id="rain" aria-hidden="true"></canvas>
<canvas id="chars" aria-hidden="true"></canvas>

<header class="bar">
  <a href="anse.html">← 返回 ANSE</a>
  <span class="mid">紫 罗 兰</span>
  <a href="aygy.html">AYGY 暗夜古韵 →</a>
</header>

<main>
  <svg id="flower" viewBox="0 0 240 240" aria-hidden="true">
    <defs>
      <radialGradient id="petalFill" cx="30%" cy="20%" r="90%">
        <stop offset="0%" stop-color="#ddd6fe"/>
        <stop offset="55%" stop-color="#a78bfa"/>
        <stop offset="100%" stop-color="#6d3fd4"/>
      </radialGradient>
    </defs>
    <g transform="translate(120,120)">
      <g id="petals"></g>
      <g id="core"></g>
    </g>
  </svg>
  <p id="hint">一切的终焉即为开始</p>
  <div id="lamps" aria-label="七盏灯的位置"></div>
  <p id="tip"><span class="who">灯下面好像有什么东西</span></p>
  <p class="night" id="n1">第一夜<em>点灯</em></p>
  <label id="passWrap" for="pass">
    <span class="ps-caret">&gt;</span>
    <input id="pass" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="你想好了吗？" aria-label="那便输入那个词">
  </label>
  <a id="go" href="index.html">回目录 →</a>
  <div id="finale">
    <span>灯都点亮了。</span>
    <span>大家就都会回来吧？</span>
    <span class="dots">…………</span>
    <b>城里的人，回来了。</b>
    <span>嗯，都回来了……</span>
    <span>吧？</span>
  </div>

  <div id="layer2">
    <p class="night" id="n2">第二夜<em>重读</em></p>
    <p class="l2ask" id="l2ask"></p>
    <p class="l2hint">有些话不是写出来的，是敲出来的。</p>
  <label id="l2Wrap" for="l2pass">
      <span class="ps-caret">&gt;</span>
      <input id="l2pass" type="text" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="再想想" aria-label="第二层的答案">
    </label>
  </div>

  <div id="layer3">
    <p class="night" id="n3">第三夜<em>带走</em></p>
    <p class="l3ln" id="l3l0"></p>
    <div id="l3take">
      <button id="l3dl" type="button">把灯取下来</button>
    </div>
    <div id="l3put">
      <label class="l3drop" for="l3file">
        <b>把灯放回去</b>
        选好之后，点这里
      </label>
      <input id="l3file" type="file" accept=".txt,text/plain" hidden>
      <p id="l3msg"></p>
    </div>
    <div id="l3end">
      <p>灯不在城里了。</p>
      <p>它在你手上，被叫了另一个名字。</p>
      <p class="warm">……她听见了。</p>
      <p>于是那一夜，城里第一次有了脚步声。</p>
      <p class="warm">她走了出去。</p>
      <p>外面没有灯。<br>但外面有天亮。</p>
      <p class="warm">一切的终焉即为开始。</p>
    </div>
    <div id="l3note">
      <p>这一夜的事，可以写下来。<em>不用交给谁，你自己留着。</em></p>
      <button id="l3save" type="button">写下来</button>
      <p id="l3saved"></p>
    </div>
  </div>

  <p id="resetline">
    <button id="rstBtn" type="button">重新开始解密</button>
    <span id="rstMsg">会清掉三夜的进度和那份记录。</span>
  </p>

</main>

<script>
(function(){
  'use strict';

  /* ---------- 0/1 雨 ---------- */
  var cv = document.getElementById('rain');
  var cx = cv.getContext('2d');
  var CW = 9, CH = 15, cols = 0, rows = 0, grid = null, tint = null;

  function build(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / CW) + 1;
    rows = Math.ceil(h / CH) + 1;
    var n = cols * rows;
    grid = new Uint8Array(n);
    tint = new Uint8Array(n);
    for (var i = 0; i < n; i++){
      grid[i] = Math.random() < 0.5 ? 0 : 1;
      var r = Math.random();
      tint[i] = r > 0.994 ? 1 : (r > 0.988 ? 2 : 0);
    }
    cx.font = '12px ' + getComputedStyle(document.body).getPropertyValue('--mono');
    cx.textBaseline = 'top';
  }

  var acc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    if (!grid) return;
    if (now - acc < 90) return;
    acc = now;

    cx.fillStyle = 'rgba(5,5,10,.32)';
    cx.fillRect(0, 0, cv.width, cv.height);

    var n = grid.length;
    for (var k = 0; k < n; k++){
      if (Math.random() > 0.14) continue;
      var i = (Math.random() * n) | 0;
      grid[i] = grid[i] ? 0 : 1;
      var c = i % cols, r = (i / cols) | 0;
      var t = tint[i];
      cx.fillStyle = t === 1 ? 'rgba(255,80,80,.5)'
                    : t === 2 ? 'rgba(111,227,214,.45)'
                    : 'rgba(255,255,255,' + (0.05 + Math.random() * 0.10).toFixed(3) + ')';
      cx.fillText(grid[i] ? '1' : '0', c * CW, r * CH);
    }
  }

  /* ---------- 背景字符画 ---------- */
  var acv = document.getElementById('chars');
  var ax = acv.getContext('2d');
  var A_D = 1, A_W = 0, A_H = 0;

  /* 六种小图案：花、星、叶、灯、钥匙、螺旋 */
  var ARTS = [
    ['  ,-.  ', ' (   ) ', '  `-\'  '],
    ['   *   ', '  ***  ', ' ***** ', '  ***  ', '   *   '],
    ['  /\   ', ' /  \  ', '/____\ '],
    ['   |   ', '  .-.  ', ' (   ) ', '  `-\'  '],
    ['  o-o  ', '  | |  ', '  o-o  '],
    [' /\'`\ ', '(  .  )', ' \_/\_/']
  ];

  var floaters = [];

  function aBuild(){
    A_D = Math.min(2, window.devicePixelRatio || 1);
    A_W = window.innerWidth; A_H = window.innerHeight;
    acv.width = A_W * A_D; acv.height = A_H * A_D;
    acv.style.width = A_W + 'px'; acv.style.height = A_H + 'px';
    ax.setTransform(A_D, 0, 0, A_D, 0, 0);
    ax.font = '13px ' + getComputedStyle(document.body).getPropertyValue('--mono');
    ax.textBaseline = 'top';

    var count = Math.max(7, Math.round(A_W * A_H / 120000));
    floaters = [];
    for (var i = 0; i < count; i++){
      floaters.push({
        a: (Math.random() * ARTS.length) | 0,
        x: Math.random() * A_W,
        y: Math.random() * A_H,
        v: 0.08 + Math.random() * 0.14,
        p: Math.random() * 6.28,
        o: 0.12 + Math.random() * 0.15
      });
    }
  }

  function aFrame(now){
    if (!floaters.length) return;
    ax.clearRect(0, 0, A_W, A_H);
    for (var i = 0; i < floaters.length; i++){
      var f = floaters[i];
      f.y -= f.v;
      if (f.y < -60){ f.y = A_H + 30; f.x = Math.random() * A_W; }
      var x = f.x + Math.sin(now * 0.0006 + f.p) * 8;
      ax.fillStyle = 'rgba(160,140,220,' + f.o.toFixed(3) + ')';
      var rows = ARTS[f.a];
      for (var r = 0; r < rows.length; r++){
        ax.fillText(rows[r], x, f.y + r * 15);
      }
    }
  }

  /* ---------- 紫罗兰（SVG） ---------- */
  var flower = document.getElementById('flower');
  var petals = document.getElementById('petals');
  var core = document.getElementById('core');
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* 七片外瓣 */
  for (var i = 0; i < 7; i++){
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('class', 'petal');
    p.setAttribute('d', 'M0,-46 C-28,-63 -22,-94 0,-102 C22,-94 28,-63 0,-46 Z');
    p.setAttribute('transform', 'rotate(' + (i * 360 / 7).toFixed(2) + ')');
    petals.appendChild(p);
  }

  /* 中心五瓣 + 花心 */
  for (var j = 0; j < 5; j++){
    var c = document.createElementNS(SVGNS, 'path');
    c.setAttribute('class', 'cp');
    c.setAttribute('d', 'M0,-7 C-17,-17 -19,-38 0,-43 C19,-38 17,-17 0,-7 Z');
    c.setAttribute('transform', 'rotate(' + (j * 72 + 18) + ')');
    core.appendChild(c);
  }
  var eye = document.createElementNS(SVGNS, 'circle');
  eye.setAttribute('class', 'eye');
  eye.setAttribute('r', '5.5');
  core.appendChild(eye);

  /* 只驱动字符画层 */
  function spin(now){
    aFrame(now);
    requestAnimationFrame(spin);
  }

  /* ---------- 七盏灯 · 第二盏（控制台） ---------- */
  (function () {
    var c1 = 'color:#a78bfa;font-size:15px;letter-spacing:.42em';
    var c2 = 'color:rgba(255,255,255,.42);font-size:11px;line-height:1.7';
    var c3 = 'color:#ddd6fe;font-size:22px;letter-spacing:.3em;text-shadow:0 0 12px rgba(167,139,250,.6)';
    console.log('%c灯照不到的地方', c1);
    var L2 = [
      '欸，你看到这个了吖？',
      '那你没按 F12的话，就看不见它了。',
      '但现在你已经看到了',
      '对吧？'
    ].join(String.fromCharCode(10));
    console.log('%c' + L2, c2);
    console.log('%c这个是第二盏了：A', c3);
    console.log('%c加油哦', c2);

    /* 在控制台里也能问 */
    window.lamp = function (n) {
      var said = {
        2: '呐，第二盏：A。你已经拿到了。',
        1: '第一盏在 aygy 那一页的源码里哦。Ctrl+U。',
        7: '当然啦，第七盏还没点着。它要等你回来第七次。'
      };
      if (n === undefined) {
        console.log('%c用法：lamp(1) 到 lamp(7)', c2);
        return;
      }
      console.log('%c' + (said[n] || '那盏还没做。'), c2);
    };
  })();

  var hint = document.getElementById('hint');

  var SEQ = [420, 190, 260, 170, 320, 170, 400, 160, 0];
  var acc2 = 0;
  SEQ.forEach(function(gap, i){
    acc2 += gap;
    setTimeout(function(){
      if (i === SEQ.length - 1){
        flower.classList.add('lit');
        var first = petals.querySelector('.petal');
        if (first) first.classList.add('on');
        try { localStorage.setItem('aygy.layer1.done', '1'); } catch (e) {}
        setTimeout(function(){
          if (!l2) return;
          var pw = document.getElementById('passWrap');
          if (pw) pw.style.display = 'none';
          l2.classList.add('on');
        var n2 = document.getElementById('n2');
        if (n2) n2.classList.add('on');
          setTimeout(function(){
            try { l2.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { l2.scrollIntoView(); }
          }, 220);
          if (l2ask) l2ask.innerHTML = '可是……<br>好像还少了点什么。<br><br>不是少了灯，是少了一个说法。';
        }, 2400);
        setTimeout(function(){ hint.classList.add('on'); }, 600);
      } else {
        flower.classList.toggle('lit', i % 2 === 0);
      }
    }, acc2);
  });

  /* ---------- 七盏灯的位置 ---------- */
  (function(){
    var TIPS = [
      '第一盏：常欣赏画的一面，而忽视另一面<br>虽然另一面没有多少艺术，但这是画的底色。',
      '第二盏：灯光不只照耀在你看得见的舞台上<br>大多数的事物都在你看不见的地方闪耀着。',
      '第三盏：学院的东西不知道为什么只肯在纸上现身。<br>屏幕照不出它，纸能。',
      '第四盏：在起始处，它只是个底层饰品。<br>你得把它带走，或者放到其他地方。',
      '第五盏：旅者注视那过大的窗户。<br>太宽了，它站不住脚。',
      '第六盏：世界的一切都要等。<br>她在广场那边等待什么。',
      '第七盏：当你读到第七次的时候，<br>你会了解到更多事物。'
    ];
    var wrap = document.getElementById('lamps');
    var out = document.getElementById('tip');
    var cur = -1, timer = null;

    function type(it){
      clearInterval(timer);
      var i = 0;
      out.innerHTML = '<span class="who">灯说：</span><br>';
      timer = setInterval(function(){
        i += 1;
        out.innerHTML = '<span class="who">灯说：</span><br>' + it.slice(0, i);
        if (i >= it.length){ clearInterval(timer); timer = null; }
      }, 55);
    }

    TIPS.forEach(function(t, n){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = '□';
      b.setAttribute('aria-label', '第 ' + (n + 1) + ' 盏');
      b.addEventListener('click', function(){
        if (cur === n){
          cur = -1; b.classList.remove('on');
          clearInterval(timer);
          out.innerHTML = '<span class="who">点一个方框，问灯在哪</span>';
          return;
        }
        Array.prototype.forEach.call(wrap.children, function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        cur = n;
        type(t);
      });
      wrap.appendChild(b);
    });
  })();

  /* ---------- 启动 ---------- */
  aBuild();
  requestAnimationFrame(spin);
  build();
  requestAnimationFrame(frame);

  var rt = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ build(); aBuild(); }, 220);
  });

  if (l2pass){
    l2pass.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      var v = l2pass.value.replace(/\s+/g, '').toUpperCase();
      if (!v) return;
      if (v === 'MISSING'){
        // 误导向：是答案，但不是最终那个
        l2pass.value = '';
        if (!hasLog('l2a')) logIt('l2a');
        l2ask.innerHTML = '不对。<br><br>……不，也不是不对。<br>只是这不是我要的那个词。<br><br>他们不是不见了。<br>是我把他们填进去了。<br><br>学院那边有一页纸，背面写着怎么换。';
        l2pass.blur();
        l2pass.placeholder = '换一个词';
      } else if (v === 'FILLING'){
        l2pass.value = '';
        if (!hasLog('l2b')) logIt('l2b');
        l2ask.innerHTML = '对，是「填满」。<br><br>他们不是离开了，也不是不见了。<br>是我一个位置一个位置，把他们填了进去。<br><br>回去读一遍那七段话——<br>我改过。';
        l2pass.blur();
        l2pass.placeholder = '灯已经点上了';
        try { localStorage.setItem('aygy.layer2.done', '1'); } catch (err) {}
      } else {
        l2Wrap.classList.add('bad');
        setTimeout(function(){ l2Wrap.classList.remove('bad'); }, 400);
        l2pass.value = '';
      }
    });
  }
})();
</script>
<script>
(function(){
  var input  = document.getElementById('pass');
  var finale = document.getElementById('finale');
  var flowerEl = document.getElementById('flower');
  var petalEls = document.querySelectorAll('#petals .petal');
  var ANSWER = 'LANTERN';
  var opened = false;
  var l2     = document.getElementById('layer2');
  var l2ask  = document.getElementById('l2ask');
  var l2pass = document.getElementById('l2pass');
  var l2Wrap = document.getElementById('l2Wrap');

  if (!input || !finale || !petalEls.length) return;


  input.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || opened) return;
    var v = input.value.replace(/\s+/g, '').toUpperCase();
    if (!v) return;

    if (v === ANSWER){
      opened = true;
      input.value = '';
      input.placeholder = '灯已经点上了';
      input.blur();
      input.style.opacity = '.45';

      if (!hasLog('l1')) logIt('l1');

      /* 七片花瓣依次亮 */
      [].forEach.call(petalEls, function(p, i){
        setTimeout(function(){ p.classList.add('on'); }, 240 + i * 300);
      });
      /* 中心整朵亮起来 */
      setTimeout(function(){ flowerEl.classList.add('lit'); }, 240 + 7 * 300 + 260);
      /* 收尾文字 */
      setTimeout(function(){ finale.classList.add('on'); }, 240 + 7 * 300 + 900);

      /* 第二层入口：等收尾文字念完再浮出来 */
      setTimeout(function(){
        var pw = document.getElementById('passWrap');
        if (pw) pw.style.display = 'none';
        if (!l2 || !l2ask) return;
        l2ask.innerHTML = '';
        l2.classList.add('on');
        var LINES = ['可是……', '好像还少了点什么。', '', '不是少了灯，是少了一个说法。'];
        LINES.forEach(function(txt, i){
          setTimeout(function(){
            var el = document.createElement('p');
            el.className = 'l2ln';
            el.textContent = txt;
            l2ask.appendChild(el);
            void el.offsetWidth;
            setTimeout(function(){ el.classList.add('on'); }, 40);
          }, i * 1100);
        });
        setTimeout(function(){
          var h = document.querySelector('.l2hint');
          if (h) h.classList.add('on');
        }, LINES.length * 1100 + 400);
        setTimeout(function(){
          var w = document.getElementById('l2Wrap');
          if (w) w.classList.add('on');
          try { l2.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
          catch (e) { l2.scrollIntoView(); }
        }, LINES.length * 1100 + 1400);
      }, 240 + 7 * 300 + 900 + 2400);
    } else {
      var wrap = document.getElementById('passWrap');
      wrap.classList.remove('bad');
      void wrap.offsetWidth;
      wrap.classList.add('bad');
      input.value = '';
      setTimeout(function(){ wrap.classList.remove('bad'); }, 500);
    }
  });
})();
</script>

<script>
(function(){
  'use strict';
  var wrap = document.getElementById('layer3');
  if (!wrap) return;
  var l0    = document.getElementById('l3l0');
  var take  = document.getElementById('l3take');
  var put   = document.getElementById('l3put');
  var file  = document.getElementById('l3file');
  var msg   = document.getElementById('l3msg');
  var end   = document.getElementById('l3end');
  var dl    = document.getElementById('l3dl');
  var done  = false;

  var LINES = [
    '第七夜。',
    '灯都亮着，城里还是空的。',
    '——灯不该留在这儿。它得被带出去。'
  ];

  function showLines(cb){
    LINES.forEach(function(t, i){
      setTimeout(function(){
        if (i === 0){ l0.textContent = t; l0.classList.add('on'); return; }
        var p = document.createElement('p');
        p.className = 'l3ln';
        p.textContent = t;
        wrap.insertBefore(p, take);
        void p.offsetWidth;
        setTimeout(function(){ p.classList.add('on'); }, 40);
      }, i * 900);
    });
    setTimeout(cb, (LINES.length - 1) * 900 + 500);
  }

  function already(){
    try { return localStorage.getItem('aygy.layer3.done') === '1'; } catch (e) { return false; }
  }

  function finish(){
    if (done) return;
    if (!hasLog('l3')) logIt('l3');
    done = true;
    try { localStorage.setItem('aygy.layer3.done', '1'); } catch (e) {}
    document.body.classList.add('l3done');
    take.style.display = 'none';
    put.classList.remove('on');
    put.style.display = 'none';
    end.classList.add('on');
    [].forEach.call(end.querySelectorAll('p'), function(p, i){
      setTimeout(function(){ p.classList.add('on'); }, 260 + i * 900);
    });
    var nb = document.getElementById('l3note');
    if (nb){ nb.classList.add('on'); }
    try { end.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    catch (e) { end.scrollIntoView(); }
  }

  function read(fileObj){
    var name = (fileObj.name || '').replace(/\.[^.]+$/, '').trim();
    var msgBad = function(t){ msg.className = 'bad'; msg.textContent = t; };
    var fr = new FileReader();
    fr.onload = function(){
      var txt = String(fr.result || '');
      var nameOk = (name === '安娜斯千');
      var isIt   = (txt.indexOf('改一个名字') >= 0) && (txt.indexOf('放回来') >= 0);
      if (!isIt){ msgBad('这不是那盏灯。你在别处捡的。'); return; }
      if (!nameOk){ msgBad('名字不对。\n灯不叫灯，城不叫城。\n她等的是有人叫她。'); return; }
      msg.className = '';
      msg.textContent = '';
      finish();
    };
    fr.onerror = function(){ msgBad('读不出来。再试一次。'); };
    fr.readAsText(fileObj);
  }

  if (dl){
    dl.addEventListener('click', function(){
      var body = [
        '第七夜，灯还亮着。',
        '城里没有别人了。',
        '',
        '这盏灯不是留在这儿的。',
        '它得被带出去，改一个名字，再放回来。',
        '',
        '名字要是她的。',
        '不是「灯」，不是「城」，不是「回来」。',
        '是那个一直等在东北塔楼里的人的名字。',
        '',
        '（改完，回到刚才那页，把它放回去。）'
      ].join('\n');
      var blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '灯.txt';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
      put.style.display = 'block';
      void put.offsetWidth;
      setTimeout(function(){ put.classList.add('on'); }, 30);
      dl.blur();
      dl.textContent = '再取一次';
    });
  }

  if (file){
    file.addEventListener('change', function(){
      if (file.files && file.files[0]) read(file.files[0]);
    });
  }

  /* 拖拽也行 */
  if (put){
    ['dragenter','dragover'].forEach(function(ev){
      put.addEventListener(ev, function(e){ e.preventDefault(); });
    });
    put.addEventListener('drop', function(e){
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) read(f);
    });
  }

  function enter(){
    if (already()){
      document.body.classList.add('l3done');
      wrap.classList.add('on');
    var n3 = document.getElementById('n3');
    if (n3) n3.classList.add('on');
      finish();
      return;
    }
    wrap.classList.add('on');
    showLines(function(){});
  }

  /* ---------- 解密记录：走过的每一步 ---------- */
  var LOGKEY = 'aygy.log';
  function nowStr(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function loadLog(){
    try { var a = JSON.parse(localStorage.getItem(LOGKEY) || '[]'); return Object.prototype.toString.call(a) === '[object Array]' ? a : []; }
    catch (e) { return []; }
  }
  function logIt(key){
    var a = loadLog();
    a.push({ k: key, t: nowStr() });
    try { localStorage.setItem(LOGKEY, JSON.stringify(a)); } catch (e) {}
  }
  function hasLog(key){
    return loadLog().some(function(x){ return x && x.k === key; });
  }

  /* 每一夜做过什么、怎么做的 —— 写进记录里 */
  var STEPS = {
    l1: {
      n: '第一夜 · 点灯',
      b: [
        '七盏灯散在七个地方，一页一盏，谁也没说哪页有灯。',
        '一、在 aygy 那一页按 Ctrl+U 看源码，注释里写着「第一盏：L」。',
        '二、回紫罗兰这一页，按 F12 打开控制台——第二盏 A 打在输出里。',
        '三、去泛大陆联合学院，按 Ctrl+P 打印，编号 007 那份档案的背面是第三盏 N。',
        '四、回首页，页脚那句「四个世界，一个人」可以复制；复制出来的比看到的多了半行：第四盏 T。',
        '五、把防风那一页的窗口压窄——窄到七百来像素，小屏幕里浮出第五盏 E。',
        '六、回到 aygy 的第二节，别动，等够半分钟，第六盏 R 自己出来。',
        '七、第七次打开单词表，第七盏 N。',
        '七个字母按顺序拼起来是 LANTERN。回到紫罗兰这一页敲进去，七片花瓣依次亮起来。'
      ]
    },
    l2a: {
      n: '第二夜 · 重读（试着说了另一个词）',
      b: [
        '灯亮之后回 aygy，七段正文底下各多出一条淡紫色的批注。',
        '每条批注末尾有一串摩斯码：— — 是 M，· · 是 I，· · · 是 S，— · 是 N，— — · 是 G。',
        '按段落顺序拼出来是 MISSING。回到紫罗兰这一页输进去——被挡了回来。',
        '它说：也不是不对，只是这不是我要的那个词。他们不是不见了，是我把他们填进去了。'
      ]
    },
    l2b: {
      n: '第二夜 · 换了一个说法',
      b: [
        '去泛大陆联合学院按 Ctrl+P，编号 007 的档案背面有一行铅笔字：M 换 F，S 换 L，其余照抄。',
        '按这张表把 MISSING 逐字换掉，得到 FILLING——缺失换成了填满。',
        '再输一次，这次对了。'
      ]
    },
    l3: {
      n: '第三夜 · 带走',
      b: [
        '灯全亮之后，紫罗兰这一页底下浮出「第七夜」：灯都亮着，城里还是空的。',
        '点「把灯取下来」，会下载一份 灯.txt。文件里说：这盏灯不该留在城里，得带出去、改一个名字、再放回来。',
        '在系统里把它改名成「安娜斯千」——不叫灯，也不叫 LANTERN。',
        '再拖回页面上的投放框。页面检查两件事：名字对不对，内容是不是那盏灯。',
        '都对之后，雨暗下去，她走了出去。外面没有灯，但外面有天亮。'
      ]
    }
  };
  var ORDER = ['l1', 'l2a', 'l2b', 'l3'];

  /* 老存档没有记录时，按已完成的层补上 */
  function seedLog(){
    var a = loadLog();
    if (a.length) return;
    var L1 = false, L2 = false, L3 = false;
    try {
      L1 = localStorage.getItem('aygy.layer1.done') === '1';
      L2 = localStorage.getItem('aygy.layer2.done') === '1';
      L3 = localStorage.getItem('aygy.layer3.done') === '1';
    } catch (e) {}
    if (L1) logIt('l1');
    if (L2){ logIt('l2a'); logIt('l2b'); }
    if (L3) logIt('l3');
  }

  function buildNote(){
    var rows = loadLog();
    var at = {};
    var first = '', last = '';
    for (var i = 0; i < rows.length; i++){
      var r = rows[i] || {};
      if (!r.k) continue;
      if (!at[r.k]) at[r.k] = r.t || '';
      if (!first) first = r.t || '';
      last = r.t || last;
    }
    var A = [];
    A.push('《紫罗兰 · 解密记录》');
    A.push('');
    A.push('记录者：你');
    A.push('记录时间：' + nowStr());
    if (first) A.push('起始：' + first);
    if (last && last !== first) A.push('最后一夜：' + last);
    A.push('');
    A.push('—— 序');
    A.push('');
    A.push('这座城只有一条街、一盏灯、一个人。');
    A.push('她不太会好好说话，但她把灯留给了你。');
    A.push('下面是她和你一起走过来的每一步，按做的先后记着。');

    for (var n = 0; n < ORDER.length; n++){
      var k = ORDER[n];
      if (!at[k]) continue;
      var st = STEPS[k];
      A.push('');
      A.push('——');
      A.push('');
      A.push('【' + st.n + '】');
      A.push('时间：' + at[k]);
      A.push('');
      for (var b = 0; b < st.b.length; b++) A.push(st.b[b]);
    }

    A.push('');
    A.push('—— 尾');
    A.push('');
    A.push('灯不在城里了，城还在。');
    A.push('她说，一切的终焉即为开始。');
    A.push('');
    A.push('（这份记录留在你自己手里。）');
    return A.join('\r\n');
  }

  function saveNote(btn, msg){
    var txt = buildNote();
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    var name = '解密记录-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.txt';
    try {
      var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
      if (msg) msg.textContent = '已保存。文件名叫「' + name + '」。';
    } catch (e) {
      if (msg) msg.textContent = '这台浏览器不让存，你可以全选这段文字自己复制。';
    }
  }

  seedLog();

  (function bindNote(){
    var btn = document.getElementById('l3save');
    var s2 = document.getElementById('l3saved');
    if (btn) btn.addEventListener('click', function(){ saveNote(btn, s2); });
  })();

  var n1 = document.getElementById('n1');
  if (n1) n1.classList.add('on');

  /* 本页刚答完第二层 → 稍等再浮出 */
  (function watch(){
    var p = document.getElementById('l2pass');
    if (!p) return;
    p.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      if (p.value.replace(/\s+/g,'').toUpperCase() === 'FILLING'){
        setTimeout(enter, 1500);
      }
    });
  })();

  /* 之前已经答过第二层 */
  try {
    if (localStorage.getItem('aygy.layer2.done') === '1') setTimeout(enter, 900);
  } catch (e) {}
})();
</script>
<script>
(function(){
  var b = document.getElementById('rstBtn'), m = document.getElementById('rstMsg');
  if (!b) return;
  var armed = false, tmr = 0;
  function disarm(){
    armed = false; b.classList.remove('armed'); b.textContent = '重新开始解密';
    m.className = ''; m.textContent = '会清掉三夜的进度和那份记录。';
  }
  b.addEventListener('click', function(){
    if (!armed){
      armed = true; b.classList.add('armed'); b.textContent = '真的要从头来吗？';
      m.className = 'warn'; m.textContent = '再点一次就清空。';
      tmr = setTimeout(disarm, 5000);
      return;
    }
    clearTimeout(tmr);
    var keys = [], i, k;
    try {
      for (i = 0; i < localStorage.length; i++){
        k = localStorage.key(i);
        if (k && (k.indexOf('aygy.') === 0 || k === 'fanda.vault')) keys.push(k);
      }
    } catch (e) {}
    for (i = 0; i < keys.length; i++){ try { localStorage.removeItem(keys[i]); } catch (e) {} }
    m.className = 'done'; m.textContent = '已经清掉了。回到最开始。';
    b.classList.remove('armed'); b.textContent = '重新开始解密'; armed = false;
    setTimeout(function(){ location.href = 'lantern.html'; }, 1100);
  });
})();
</script>
